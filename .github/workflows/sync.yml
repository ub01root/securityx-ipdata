name: Daily IP data sync

on:
  schedule:
    # 02:00 UTC daily — upstream lists refresh in the early hours.
    - cron: '0 2 * * *'

  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'sync.mjs'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

concurrency:
  group: ip-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Node.js
      # ------------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ------------------------------------------------------------
      # Build lists
      # ------------------------------------------------------------
      - name: Build lists
        run: |
          node sync.mjs --out=out

      # ------------------------------------------------------------
      # Summary
      # ------------------------------------------------------------
      - name: Summarize
        run: |
          {
            echo '### Range counts'
            echo '| file | ranges | invalid skipped |'
            echo '| --- | --- | --- |'

            node -e "
              const m = require('./out/manifest.json');

              for (const [f, i] of Object.entries(m.files)) {
                if (f === 'manifest.json') continue;

                console.log(
                  '| ' +
                  f +
                  ' | ' +
                  i.lines +
                  ' | ' +
                  (i.invalidLines || 0) +
                  ' |'
                );
              }
            "
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      # Validate generated data
      # ------------------------------------------------------------
      - name: Validate
        run: |
          set -euo pipefail

          echo "Validating generated files..."

          for f in \
            vpn-ipv4 \
            vpn-ipv6 \
            datacenter-ipv4 \
            datacenter-ipv6 \
            proxy-ipv4 \
            proxy-ipv6 \
            tor-ipv4 \
            tor-ipv6 \
            webhost-ipv4 \
            webhost-ipv6
          do
            test -f "out/$f.txt" || {
              echo "ERROR: missing out/$f.txt"
              exit 1
            }

            echo "$(wc -l < "out/$f.txt") $f"
          done

          echo "Validating manifest..."

          node -e '
            const fs = require("fs");

            const m = JSON.parse(
              fs.readFileSync("out/manifest.json", "utf8")
            );

            if (!fs.existsSync("prev.json")) {
              console.log(
                "No prev.json found, skipping regression check."
              );

              process.exit(0);
            }

            const prev = JSON.parse(
              fs.readFileSync("prev.json", "utf8")
            );

            let bad = 0;

            for (const [f, i] of Object.entries(m.files)) {
              if (f === "manifest.json") continue;

              const before = prev.files?.[f]?.lines;

              if (typeof before !== "number" || before < 100) {
                continue;
              }

              if (i.lines < before * 0.5) {
                console.error(
                  `REGRESSION ${f}: ${before} -> ${i.lines}`
                );

                bad += 1;
              }
            }

            if (bad) {
              console.error(
                `${bad} regression(s) detected.`
              );

              process.exit(1);
            }

            console.log("Regression validation passed.");
          '

      # ------------------------------------------------------------
      # Publish / replace daily release
      # ------------------------------------------------------------
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Use UTC so the release date is consistent with the
          # scheduled workflow.
          tag="data-$(date -u +%Y.%m.%d)"

          echo "Release tag: $tag"

          # Generate release notes from manifest.json.
          notes=$(node -e "
            const m = require('./out/manifest.json');

            console.log(
              'generated: ' +
              m.generatedAt +
              '\n\n' +
              Object.entries(m.files)
                .filter(([f]) => f !== 'manifest.json')
                .map(([f, i]) => '- ' + f + ': ' + i.lines + ' ranges')
                .join('\n')
            );
          ")

          echo "Checking existing release..."

          # ----------------------------------------------------------
          # Case 1:
          # Release already exists.
          #
          # Upload the new files with --clobber and update the
          # release metadata.
          # ----------------------------------------------------------
          if gh release view "$tag" >/dev/null 2>&1; then

            echo "Release $tag already exists."
            echo "Replacing existing release data..."

            gh release upload "$tag" \
              out/*.txt \
              out/manifest.json \
              --clobber

            gh release edit "$tag" \
              --title "$tag" \
              --notes "$notes" \
              --latest

            echo "Release $tag updated successfully."

          # ----------------------------------------------------------
          # Case 2:
          # Tag exists but release does not.
          #
          # Remove the existing tag and recreate it.
          # ----------------------------------------------------------
          elif git ls-remote \
            --tags origin \
            "refs/tags/$tag" |
            grep -q "refs/tags/$tag"; then

            echo "Tag $tag exists without a release."
            echo "Replacing existing tag..."

            git push origin ":refs/tags/$tag"

            git tag -d "$tag" 2>/dev/null || true

            gh release create "$tag" \
              out/*.txt \
              out/manifest.json \
              --title "$tag" \
              --notes "$notes" \
              --latest

            echo "Tag and release $tag recreated successfully."

          # ----------------------------------------------------------
          # Case 3:
          # Nothing exists.
          #
          # Create a completely new release.
          # ----------------------------------------------------------
          else

            echo "Release $tag does not exist."
            echo "Creating new release..."

            gh release create "$tag" \
              out/*.txt \
              out/manifest.json \
              --title "$tag" \
              --notes "$notes" \
              --latest

            echo "Release $tag created successfully."

          fi

      # ------------------------------------------------------------
      # Record manifest
      # ------------------------------------------------------------
      - name: Record manifest
        run: |
          set -euo pipefail

          day=$(date -u +%Y.%m.%d)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          mkdir -p history

          # Store the manifest for this day.
          cp out/manifest.json \
            "history/manifest-$day.json"

          # Store the current manifest for the next regression check.
          cp out/manifest.json \
            prev.json

          git add prev.json history

          git commit \
            -m "chore: ip data manifest for $day" \
            || echo 'nothing to commit'

          git push